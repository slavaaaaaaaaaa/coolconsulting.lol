# Pinned to a commit, not a tag, on purpose. This site is built against minima's
# master branch (3.x-dev): head.html links /assets/css/style.css and the social
# includes use the {platform, user_url} config shape. The newest release, v2.5.2,
# emits /assets/main.css and the older social format instead — pinning to the tag
# would 404 the stylesheet and ship the site unstyled.
#
# Unpinned, master is a moving target that can change the site with no commit
# here. This SHA is master as of 2026-07-31 and produces byte-identical output.
# To move it: bump the SHA, `bundle exec jekyll build`, and diff _site.
remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c
layout: default
logo: /logo.png
title: 'Cool Consulting, LLC'
tagline: "Oui, c'est cool."
url: https://coolconsulting.lol

description: >
  A boutique engineering consultancy in Seattle. GCP and AWS platform
  engineering, SRE, and LLM products built to survive production.

# Google Calendar appointment schedule — referenced as {{ site.booking_url }} so
# the link lives in one place rather than pasted into every page.
booking_url: https://calendar.google.com/appointments/schedules/AcZssZ2zPTJmNKjOw3syRjErhRpK7Qa96LlS7Lva-naJGHdenR_4fWFkua_HBmZTHwZ9CaEI0t5X7Hlq

# GitHub Pages forces these regardless of what is set here; declaring them
# explicitly is what makes a local `bundle exec jekyll serve` render markdown
# identically to the deployed site instead of falling back to kramdown's defaults.
markdown: kramdown
highlighter: rouge
sass:
  style: compressed
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  syntax_highlighter: rouge

# Declaring plugins here replaces the list the theme would otherwise supply, so
# every plugin the site depends on has to be named explicitly — drop one and the
# {% seo %} call in _includes/head.html silently stops rendering.
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-redirect-from

# Sitewide link-preview card. Any page can override with `image:` in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-default.png

twitter:
  card: summary_large_image

minima:
  skin: auto
  social_links:
    - platform: github
      user_url: "https://github.com/Cool-Consulting-LLC"
    - platform: linkedin
      user_url: "https://www.linkedin.com/in/slavaaa/"

author:
  name: Slava I. Maslennikov
  email: us@coolconsulting.lol
