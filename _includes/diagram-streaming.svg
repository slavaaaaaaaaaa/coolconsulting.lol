<svg class="dg" viewBox="0 0 960 620" role="img" aria-labelledby="dgSTitle dgSDesc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="dgSTitle">Infrastructure of the music streaming platform</title>
  <desc id="dgSDesc">Clients load the app from Cloud Run frontends, call a Go backend through a managed
    HTTPS load balancer, and fetch audio through a Fastly CDN that signs private paths before reaching
    GCS. The backend uses Cloud SQL Postgres, Memorystore Redis, Pub/Sub topics for transcode and
    thumbnail work, and Secret Manager. GitHub Actions authenticates through Workload Identity
    Federation and pushes container images to Artifact Registry. Terraform provisions a separate
    project per environment.</desc>

  <style>
    .dg { --dg-edge: #8b93a7; --dg-sky: #38bdf8; --dg-violet: #a970ff; --dg-amber: #f5a623;
          --dg-green: #22c58b; --dg-coral: #ff6b5e; }
    .dg text { font-family: "Inter", system-ui, -apple-system, sans-serif; }
    .dg .dg-panel { fill: var(--bg-soft, #f6f7fb); stroke: var(--border, #e6e8f0); stroke-width: 1; }
    .dg .dg-grp { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
                  fill: var(--muted, #565d6d); }
    .dg .dg-box { fill: var(--surface, #fff); stroke-width: 1.5; }
    .dg .dg-t { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 14px; font-weight: 600;
                fill: var(--fg, #14161f); }
    .dg .dg-s { font-size: 11px; fill: var(--muted, #565d6d); }
    .dg .dg-edge { fill: none; stroke: var(--dg-edge); stroke-width: 1.6; }
    .dg .dg-dash { stroke-dasharray: 5 5; }
    .dg .dg-lbl { font-size: 10.5px; font-weight: 600; fill: var(--muted, #565d6d); }
    .dg .dg-pill { fill: none; stroke: var(--border, #e6e8f0); }
    .dg .a-sky    { stroke: var(--dg-sky); }
    .dg .a-violet { stroke: var(--dg-violet); }
    .dg .a-amber  { stroke: var(--dg-amber); }
    .dg .a-green  { stroke: var(--dg-green); }
    .dg .a-coral  { stroke: var(--dg-coral); }
    .dg .w-sky    { fill: var(--dg-sky); }
    .dg .w-violet { fill: var(--dg-violet); }
    .dg .w-amber  { fill: var(--dg-amber); }
    .dg .w-green  { fill: var(--dg-green); }
    .dg .w-coral  { fill: var(--dg-coral); }
    /* Accent wash over the box fill: pale in light mode, muted in dark mode. */
    .dg .wash     { opacity: 0.10; }
  </style>

  <defs>
    <marker id="dgSArrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,4 L0,8 Z" fill="var(--dg-edge)"/>
    </marker>
  </defs>

  <rect class="dg-pill" x="676" y="8" width="264" height="24" rx="12"/>
  <text class="dg-s" x="808" y="24" text-anchor="middle">Google Cloud &#183; one project per environment</text>

  <!-- ============================ request path ============================ -->
  <rect class="dg-panel" x="20" y="44" width="920" height="252" rx="16"/>
  <text class="dg-grp" x="40" y="68">Request path</text>

  <g>
    <rect class="dg-box a-sky" x="40" y="140" width="160" height="76" rx="12"/>
    <rect class="w-sky wash" x="40" y="140" width="160" height="76" rx="12"/>
    <text class="dg-t" x="120" y="172" text-anchor="middle">Clients</text>
    <text class="dg-s" x="120" y="190" text-anchor="middle">React Native &#183; web</text>
    <text class="dg-s" x="120" y="204" text-anchor="middle">artist portal</text>
  </g>

  <g>
    <rect class="dg-box a-sky" x="248" y="76" width="200" height="58" rx="12"/>
    <rect class="w-sky wash" x="248" y="76" width="200" height="58" rx="12"/>
    <text class="dg-t" x="348" y="100" text-anchor="middle">Cloud Run &#183; frontends</text>
    <text class="dg-s" x="348" y="118" text-anchor="middle">web + portal &#183; IAP</text>
  </g>

  <g>
    <rect class="dg-box a-sky" x="248" y="150" width="200" height="58" rx="12"/>
    <rect class="w-sky wash" x="248" y="150" width="200" height="58" rx="12"/>
    <text class="dg-t" x="348" y="174" text-anchor="middle">HTTPS load balancer</text>
    <text class="dg-s" x="348" y="192" text-anchor="middle">managed TLS &#183; global IP</text>
  </g>

  <g>
    <rect class="dg-box a-amber" x="248" y="224" width="200" height="58" rx="12"/>
    <rect class="w-amber wash" x="248" y="224" width="200" height="58" rx="12"/>
    <text class="dg-t" x="348" y="248" text-anchor="middle">Fastly &#183; CDN</text>
    <text class="dg-s" x="348" y="266" text-anchor="middle">signed /private paths</text>
  </g>

  <g>
    <rect class="dg-box a-sky" x="500" y="150" width="210" height="58" rx="12"/>
    <rect class="w-sky wash" x="500" y="150" width="210" height="58" rx="12"/>
    <text class="dg-t" x="605" y="174" text-anchor="middle">Cloud Run &#183; backend</text>
    <text class="dg-s" x="605" y="192" text-anchor="middle">Go &#183; Connect / gRPC</text>
  </g>

  <g>
    <rect class="dg-box a-amber" x="500" y="224" width="210" height="58" rx="12"/>
    <rect class="w-amber wash" x="500" y="224" width="210" height="58" rx="12"/>
    <text class="dg-t" x="605" y="248" text-anchor="middle">GCS &#183; audio + images</text>
    <text class="dg-s" x="605" y="266" text-anchor="middle">origin &#183; edge access logs</text>
  </g>

  <!-- client fan-out -->
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M200,166 C226,166 222,105 244,105"/>
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M200,178 L244,179"/>
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M200,192 C226,192 222,253 244,253"/>

  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M448,179 L496,179"/>
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M448,253 L496,253"/>
  <text class="dg-lbl" x="472" y="245" text-anchor="middle">HMAC</text>

  <!-- ============================ data & async ============================ -->
  <rect class="dg-panel" x="20" y="312" width="920" height="150" rx="16"/>
  <text class="dg-grp" x="40" y="336">Data &amp; async</text>

  <!-- Backend dependency bus. Routed around the right of the GCS box, which sits
       directly beneath the backend and would otherwise be crossed by the drop. -->
  <path class="dg-edge" d="M710,179 L744,179 L744,302"/>
  <path class="dg-edge" d="M200,302 L816,302"/>
  <!-- Enters Cloud SQL right of centre so the drop clears the panel's group label. -->
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M200,302 L200,348"/>
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M359,302 L359,348"/>
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M583,302 L583,348"/>
  <path class="dg-edge dg-dash" marker-end="url(#dgSArrow)" d="M816,302 L816,348"/>

  <g>
    <rect class="dg-box a-green" x="40" y="352" width="200" height="62" rx="12"/>
    <rect class="w-green wash" x="40" y="352" width="200" height="62" rx="12"/>
    <text class="dg-t" x="140" y="378" text-anchor="middle">Cloud SQL &#183; Postgres</text>
    <text class="dg-s" x="140" y="396" text-anchor="middle">private via VPC peering</text>
  </g>

  <g>
    <rect class="dg-box a-green" x="264" y="352" width="190" height="62" rx="12"/>
    <rect class="w-green wash" x="264" y="352" width="190" height="62" rx="12"/>
    <text class="dg-t" x="359" y="378" text-anchor="middle">Memorystore</text>
    <text class="dg-s" x="359" y="396" text-anchor="middle">Redis cache</text>
  </g>

  <g>
    <rect class="dg-box a-green" x="478" y="352" width="210" height="62" rx="12"/>
    <rect class="w-green wash" x="478" y="352" width="210" height="62" rx="12"/>
    <text class="dg-t" x="583" y="378" text-anchor="middle">Pub/Sub</text>
    <text class="dg-s" x="583" y="396" text-anchor="middle">transcode &#183; thumbnail</text>
  </g>

  <g>
    <rect class="dg-box a-coral" x="712" y="352" width="208" height="62" rx="12"/>
    <rect class="w-coral wash" x="712" y="352" width="208" height="62" rx="12"/>
    <text class="dg-t" x="816" y="378" text-anchor="middle">Secret Manager</text>
    <text class="dg-s" x="816" y="396" text-anchor="middle">DB &#183; edge signing keys</text>
  </g>

  <!-- ============================ delivery ============================ -->
  <rect class="dg-panel" x="20" y="478" width="920" height="126" rx="16"/>
  <text class="dg-grp" x="40" y="502">Delivery</text>

  <g>
    <rect class="dg-box a-violet" x="40" y="516" width="180" height="62" rx="12"/>
    <rect class="w-violet wash" x="40" y="516" width="180" height="62" rx="12"/>
    <text class="dg-t" x="130" y="542" text-anchor="middle">GitHub Actions</text>
    <text class="dg-s" x="130" y="560" text-anchor="middle">build &#183; test &#183; deploy</text>
  </g>

  <g>
    <rect class="dg-box a-violet" x="252" y="516" width="196" height="62" rx="12"/>
    <rect class="w-violet wash" x="252" y="516" width="196" height="62" rx="12"/>
    <text class="dg-t" x="350" y="542" text-anchor="middle">Workload Identity</text>
    <text class="dg-s" x="350" y="560" text-anchor="middle">no long-lived keys</text>
  </g>

  <g>
    <rect class="dg-box a-violet" x="480" y="516" width="200" height="62" rx="12"/>
    <rect class="w-violet wash" x="480" y="516" width="200" height="62" rx="12"/>
    <text class="dg-t" x="580" y="542" text-anchor="middle">Artifact Registry</text>
    <text class="dg-s" x="580" y="560" text-anchor="middle">images &#8594; Cloud Run</text>
  </g>

  <g>
    <rect class="dg-box a-violet" x="712" y="516" width="208" height="62" rx="12"/>
    <rect class="w-violet wash" x="712" y="516" width="208" height="62" rx="12"/>
    <text class="dg-t" x="816" y="542" text-anchor="middle">Terraform</text>
    <text class="dg-s" x="816" y="560" text-anchor="middle">dev &#183; prod &#183; global</text>
  </g>

  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M220,547 L248,547"/>
  <path class="dg-edge" marker-end="url(#dgSArrow)" d="M448,547 L476,547"/>
</svg>
